{% load static %}
<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLabel - {% block title %}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        /* 新增折叠状态样式 */
        .sidebar-collapsed {
            width: 4rem !important;
        }

        .sidebar-collapsed .sidebar-text,
        .sidebar-collapsed .sidebar-brand,
        .sidebar-collapsed .submenu-arrow {
            opacity: 0;
            width: 0;
            height: 0;
            overflow: hidden;
            position: absolute;
        }

        .sidebar-collapsed .menu-item {
            justify-content: center;
            padding-left: 0.75rem;
            padding-right: 0.75rem;
        }

        .sidebar-collapsed .fa-bars:before {
            content: "\f061";
        }
    </style>
</head>
<body class="bg-gray-50">
<div class="min-h-screen flex">
    <!-- 侧边栏 -->
    <aside class="sidebar-transition bg-gradient-to-b from-purple-900 to-blue-800
                w-64 fixed h-screen flex flex-col" id="sidebar">
        <!-- 品牌区 -->
        <div class="p-4 border-b border-white/20">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold text-amber-400 sidebar-brand">用户文档</h1>
                <button onclick="toggleSidebar()" class="text-gray-300 hover:text-white">
                    <i class="fas fa-bars transition-transform"></i>
                </button>
            </div>
        </div>

        <!-- 修改后的主菜单 -->
        <nav class="flex-1 p-2 space-y-1 overflow-y-auto">
            <!-- 平台介绍 -->
            <a href="{% url 'user_guide' %}"
               class="menu-item flex items-center p-3 text-gray-300 hover:bg-purple-700/20 rounded-lg">
                <i class="fas fa-home w-6 text-center"></i>
                <span class="sidebar-text ml-3">平台介绍</span>
            </a>

            <!-- 基本操作 -->
            <div x-data="{ open: false }" class="relative">
                <button @click="open = !open"
                        class="w-full flex items-center p-3 text-gray-300 hover:bg-purple-700/20 rounded-lg">
                    <i class="fas fa-tags w-6 text-center"></i>
                    <span class="sidebar-text ml-3">基本操作</span>
                    <i :class="open ? 'fa-chevron-up' : 'fa-chevron-down'"
                       class="fas text-sm submenu-arrow ml-auto"></i>
                </button>

                <div x-show="open" x-collapse
                     class="ml-8 pl-2 space-y-1 border-l-2 border-purple-500/30">
                    <!-- 登录和登出 -->
                    <a href="{% url 'user_guide_basicfunction_login_logout' %}"
                       class="flex items-center p-2 text-sm text-gray-300 hover:bg-purple-700/20 rounded-lg">
                        <span class="sidebar-text">登录和登出</span>
                    </a>
                    <!-- 修改信息 -->
                    <a href="{% url 'user_guide_basicfunction_change_information' %}"
                       class="flex items-center p-2 text-sm text-gray-300 hover:bg-purple-700/20 rounded-lg">
                        <span class="sidebar-text">修改信息</span>
                    </a>
                </div>
            </div>

            <!-- 首页 -->
            <div x-data="{ open: false }" class="relative">
                <button @click="open = !open"
                        class="w-full flex items-center p-3 text-gray-300 hover:bg-purple-700/20 rounded-lg">
                    <i class="fas fa-tags w-6 text-center"></i>
                    <span class="sidebar-text ml-3">首页</span>
                    <i :class="open ? 'fa-chevron-up' : 'fa-chevron-down'"
                       class="fas text-sm submenu-arrow ml-auto"></i>
                </button>

                <div x-show="open" x-collapse
                     class="ml-8 pl-2 space-y-1 border-l-2 border-purple-500/30">
                    <!-- 标注任务总览 -->
                    <a href="{% url 'user_guide_homepage_overview' %}"
                       class="flex items-center p-2 text-sm text-gray-300 hover:bg-purple-700/20 rounded-lg">
                        <span class="sidebar-text">标注任务总览</span>
                    </a>
                    <!-- 更新日志 -->
                    <a href="{% url 'user_guide_homepage_log' %}"
                       class="flex items-center p-2 text-sm text-gray-300 hover:bg-purple-700/20 rounded-lg">
                        <span class="sidebar-text">更新日志</span>
                    </a>
                    <!-- 返回上次校验状态 -->
                    <a href="{% url 'user_guide_homepage_return' %}"
                       class="flex items-center p-2 text-sm text-gray-300 hover:bg-purple-700/20 rounded-lg">
                        <span class="sidebar-text">返回上次校验状态</span>
                    </a>
                </div>
            </div>

            <!-- 任务 -->
            <div x-data="{ open: false }" class="relative">
                <button @click="open = !open"
                        class="w-full flex items-center p-3 text-gray-300 hover:bg-purple-700/20 rounded-lg">
                    <i class="fas fa-tags w-6 text-center"></i>
                    <span class="sidebar-text ml-3">任务</span>
                    <i :class="open ? 'fa-chevron-up' : 'fa-chevron-down'"
                       class="fas text-sm submenu-arrow ml-auto"></i>
                </button>

                <div x-show="open" x-collapse
                     class="ml-8 pl-2 space-y-1 border-l-2 border-purple-500/30">
                    <!-- 创建任务 -->
                    <a href="{% url 'user_guide_task_create' %}"
                       class="flex items-center p-2 text-sm text-gray-300 hover:bg-purple-700/20 rounded-lg">
                        <span class="sidebar-text">创建任务</span>
                    </a>
                    <!-- 管理任务 -->
                    <a href="{% url 'user_guide_task_manage' %}"
                       class="flex items-center p-2 text-sm text-gray-300 hover:bg-purple-700/20 rounded-lg">
                        <span class="sidebar-text">管理任务</span>
                    </a>
                </div>
            </div>

            <!-- 校验 -->
            <div x-data="{ open: false }" class="relative">
                <button @click="open = !open"
                        class="w-full flex items-center p-3 text-gray-300 hover:bg-purple-700/20 rounded-lg">
                    <i class="fas fa-tags w-6 text-center"></i>
                    <span class="sidebar-text ml-3">校验</span>
                    <i :class="open ? 'fa-chevron-up' : 'fa-chevron-down'"
                       class="fas text-sm submenu-arrow ml-auto"></i>
                </button>

                <div x-show="open" x-collapse
                     class="ml-8 pl-2 space-y-1 border-l-2 border-purple-500/30">
                    <!-- 创建任务 -->
                    <a href="{% url 'user_guide_confirm_image_classify' %}"
                       class="flex items-center p-2 text-sm text-gray-300 hover:bg-purple-700/20 rounded-lg">
                        <span class="sidebar-text">图像分类校验</span>
                    </a>
                    <!-- 管理任务 -->
                    <a href="{% url 'user_guide_confirm_text_classify' %}"
                       class="flex items-center p-2 text-sm text-gray-300 hover:bg-purple-700/20 rounded-lg">
                        <span class="sidebar-text">文本分类校验</span>
                    </a>
                </div>
            </div>

            <!-- FAQ -->
            <a href="{% url 'user_guide_faq' %}"
               class="menu-item flex items-center p-3 text-gray-300 hover:bg-purple-700/20 rounded-lg">
                <i class="fas fa-home w-6 text-center"></i>
                <span class="sidebar-text ml-3">FAQ</span>
            </a>
        </nav>
    </aside>

    <!-- 主要内容区 -->
    <main class="flex-1 ml-64" id="mainContent">
        <!-- 顶部导航 -->
        <header class="bg-white shadow-sm">
            <div class="flex items-center justify-between px-6 py-4">
                <!-- 面包屑 -->
                <div class="text-gray-600">
                    {% block breadcrumb %}
                        <span>首页</span>
                    {% endblock %}
                </div>
            </div>
        </header>

        <!-- 内容容器 -->
        <div class="p-6">
            {% block content %}{% endblock %}
        </div>
    </main>
</div>

<!-- Alpine.js -->
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

<script>
    // 侧边栏切换函数
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');

        sidebar.classList.toggle('sidebar-collapsed');

        if (sidebar.classList.contains('sidebar-collapsed')) {
            mainContent.classList.replace('ml-64', 'ml-16');
            localStorage.setItem('sidebarCollapsed', 'true');
        } else {
            mainContent.classList.replace('ml-16', 'ml-64');
            localStorage.removeItem('sidebarCollapsed');
        }
    }

    // 初始化时检查折叠状态
    document.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('sidebarCollapsed') === 'true') {
            document.getElementById('sidebar').classList.add('sidebar-collapsed');
            document.getElementById('mainContent').classList.replace('ml-64', 'ml-16');
        }
    });
</script>
</body>
</html>
