{% load static %}
<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎使用 SmartLabel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="{% static 'favicon.ico' %}" />
    <style>
        /* 动态背景动画 */
        .circles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .circles li {
            position: absolute;
            display: block;
            width: 25px;
            height: 25px;
            background: rgba(255, 255, 255, 0.15);
            animation: animate 20s linear infinite;
            bottom: -150px;
            border-radius: 50%;
        }

        @keyframes animate {
            0% {
                transform: translateY(0) rotate(0deg);
            }
            100% {
                transform: translateY(-1000px) rotate(720deg);
            }
        }

        /* 自定义按钮样式 */
        .auth-btn {
            @apply flex-1 py-5 px-10 rounded-full font-bold
            shadow-xl transition-all duration-300
            transform hover:scale-105 hover:shadow-2xl;
            min-width: 220px;
        }
    </style>
</head>

<body class="min-h-screen overflow-hidden">
<div class="relative min-h-screen flex items-center justify-center">
    <!-- 全屏背景区 -->
    <div class="w-full min-h-screen flex items-center justify-center p-8
                   bg-gradient-to-br from-purple-900 to-blue-800 relative">

        <!-- 动态背景元素 -->
        <ul class="circles">
            {% for _ in '..........' %}
                <li style="left: {{ forloop.counter|add:'-1' }}0%"></li>
            {% endfor %}
        </ul>

        <!-- 内容容器 -->
        <div class="relative z-10 text-center space-y-10 max-w-4xl">
            <!-- 标题区 -->
            <div class="space-y-6">
                <h1 class="text-5xl lg:text-6xl font-bold text-amber-400
                              animate-pulse">
                    欢迎访问 SmartLabel
                </h1>
                <p class="text-xl text-gray-200 font-medium">
                    智能数据标注平台
                </p>
            </div>

            <!-- 功能按钮组 -->
            <div class="flex flex-col sm:flex-row gap-8 justify-center
                           w-full px-4">
                <!-- 登录按钮 -->
                <a href="{% url 'user_login' %}"
                   class="auth-btn bg-gradient-to-br from-emerald-400 to-teal-600
                              hover:from-teal-500 hover:to-emerald-400 text-white">
                    <i class="fas fa-sign-in-alt mr-3"></i>立即登录
                </a>

                <!-- 注册按钮 -->
                <a href="{% url 'user_register' %}"
                   class="auth-btn bg-gradient-to-br from-blue-400 to-indigo-600
                              hover:from-indigo-500 hover:to-blue-400 text-white">
                    <i class="fas fa-user-plus mr-3"></i>注册账号
                </a>
            </div>

            <!-- 辅助文本 -->
            <div class="text-gray-300 text-lg leading-relaxed
                            backdrop-blur-sm bg-white/10 p-6 rounded-2xl">
                <p class="mb-3">🚀 领先的半自动标注技术</p>
                <p class="mb-3">🖼️ 支持图像、文本等多种数据类型</p>
                <p>📝 依托于各种先进的人工智能算法</p>
            </div>
        </div>
    </div>
</div>

<!-- FontAwesome 图标 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>
</html>
